# Project-owned host verification; external/mobile stages are in ONBOARDING.md.
schema_version: 1
setup: bash scripts/verify-host.sh prepare
setup_scope: pass

checks:
  build:
    command: bash scripts/verify-host.sh cargo build --workspace --locked --verbose
  typecheck:
    command: bash scripts/verify-host.sh cargo check --workspace --locked --all-targets --all-features --verbose
  lint:
    command: bash scripts/verify-host.sh cargo fmt --all -- --check && bash scripts/verify-host.sh cargo clippy --workspace --all-targets --all-features -- -D warnings
  unit:
    command: bash scripts/verify-host.sh cargo test --workspace --locked --lib --bins --verbose && bash scripts/verify-host.sh cargo test --locked --test listener_logging --verbose -- --nocapture
  integration:
    command: bash scripts/verify-host.sh cargo test -p shoes --locked --features integration-tests --test integration --verbose shadowtls_cert_verification:: -- --nocapture --test-threads=1

source_ci: [".github/workflows/build.yml", ".github/workflows/lint.yml", ".github/workflows/mobile.yml", ".github/workflows/test.yml"]
